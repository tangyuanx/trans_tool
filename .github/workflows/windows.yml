name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trans-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows installer and run tests
        run: ./scripts/build.ps1 -RunTests
      - name: Build a baseline installer for the upgrade test
        run: ./scripts/build.ps1 -Version 0.0.0 -OutputDirectory "$env:RUNNER_TEMP/baseline"
      - name: Verify in-place upgrade and restart
        run: |
          ./scripts/test-install.ps1 -PreviousSetup "$env:RUNNER_TEMP/baseline/TransTool-Windows-Setup.exe" -CurrentSetup "$PWD/artifacts/TransTool-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: TransTool-Windows-Setup
          path: artifacts/TransTool-Windows-Setup.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TransTool-Windows-Setup
          path: artifacts
      - name: Publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > existing.txt; then
            if [[ "$(cat existing.txt)" == true ]]; then
              gh release upload "$tag" artifacts/TransTool-Windows-Setup.exe --clobber
              gh release edit "$tag" --draft=false --latest
            fi
            exit 0
          fi
          gh release create "$tag" artifacts/TransTool-Windows-Setup.exe --target "$GITHUB_SHA" --title "Trans Tool $tag" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false --latest
